services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aldoria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - aldoria-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aldoria"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  aldoria-postgres:
