[workspace]
resolver = "2"
members = [
  "crates/game-types",
  "crates/game-protocol",
  "crates/game-server",
  "crates/game-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# TIBIAGAME_V36_1_NATIVE_SERVER_HANDSHAKE
# Bevy/wgpu dependencies are prohibitively slow at opt-level 0.
# Keep our workspace crates easy to debug while optimizing dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
