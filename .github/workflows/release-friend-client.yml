name: Release friend client

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install client dependencies
        run: npm ci --prefix apps/client

      - name: Verify updater public key
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/client/src-tauri/updater.pub")) {
            throw "Missing updater.pub. Run npm run client:updater:setup locally and commit ONLY the public key."
          }

      - name: Generate friend Tauri config
        shell: pwsh
        run: |
          $templatePath = "apps/client/src-tauri/tauri.friend.conf.json"
          $generatedPath = "apps/client/src-tauri/tauri.friend.generated.json"
          $publicKey = (Get-Content -Raw "apps/client/src-tauri/updater.pub").Trim()
          $template = Get-Content -Raw $templatePath
          $publicKeyJson = $publicKey | ConvertTo-Json -Compress
          $generated = $template.Replace('"__ALDORIA_UPDATER_PUBKEY__"', $publicKeyJson)
          Set-Content -Path $generatedPath -Value $generated -Encoding UTF8

      # TIBIAGAME_FRIEND_UPDATER_V33_4_KEY_PATH
      - name: Prepare updater signing key
        shell: pwsh
        env:
          ALDORIA_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ALDORIA_UPDATER_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY."
          }

          $privateKey = $env:ALDORIA_UPDATER_PRIVATE_KEY.Trim()

          try {
            $decoded = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($privateKey)
            )
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY is not valid base64 key content."
          }

          if (-not $decoded.StartsWith("untrusted comment: rsign encrypted secret key")) {
            throw "TAURI_SIGNING_PRIVATE_KEY does not decode to the expected Tauri rsign secret-key format."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "aldoria-updater.key"
          [IO.File]::WriteAllText(
            $keyPath,
            $privateKey,
            [Text.UTF8Encoding]::new($false)
          )

          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" >> $env:GITHUB_ENV
          Write-Host "Updater private key prepared as a temporary file."

      # TIBIAGAME_FRIEND_UPDATER_V33_5_SIGNING_PREFLIGHT
      - name: Fast updater signing preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $keyPath = $env:TAURI_SIGNING_PRIVATE_KEY
          if ([string]::IsNullOrWhiteSpace($keyPath) -or -not (Test-Path $keyPath)) {
            throw "Updater signing preflight: temporary private key file is missing."
          }

          $probe = Join-Path $env:RUNNER_TEMP "aldoria-updater-signing-probe.txt"
          [IO.File]::WriteAllText(
            $probe,
            "aldoria-updater-signing-preflight",
            [Text.UTF8Encoding]::new($false)
          )

          Push-Location "apps/client"
          try {
            Write-Host "Testing updater private key before the expensive Tauri build..."

            # The current Aldoria updater key was created without a user password.
            # Pass an explicit empty password so CI and the bundler use the same mode.
            npm exec -- tauri signer sign --private-key-path "$keyPath" "--password=" "$probe"
            if ($LASTEXITCODE -ne 0) {
              $message = "Updater signing preflight failed BEFORE the full build. " +
                "The existing private key could not sign a tiny test file with an explicit empty password. " +
                "Do not wait for the 7-8 minute Tauri build: signing is not usable yet. " +
                "If this key was generated by Tauri CLI 2.9.3 through 2.10.0 with an empty password, " +
                "the generated key may be broken and must be regenerated. Otherwise the key was " +
                "created with a non-empty password and that exact password is required."
              throw $message
            }
          } finally {
            Pop-Location
          }

          $signature = "$probe.sig"
          if (-not (Test-Path $signature)) {
            throw "Updater signing preflight returned success but did not create $signature."
          }

          Remove-Item $probe, $signature -Force -ErrorAction SilentlyContinue
          Write-Host "Updater signing preflight PASSED." -ForegroundColor Green

      - name: Build, sign and publish Windows friend client
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep this explicit: the current Aldoria signing key uses an empty password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: "Embers of Aldoria v__VERSION__"
          releaseBody: "Friend test client. Existing installations update automatically."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --features friend-updater --config src-tauri/tauri.friend.generated.json
