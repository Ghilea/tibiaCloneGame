name: Release native friend client

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node signing tool
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install signing tool
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify updater public key
        shell: pwsh
        run: |
          if (-not (Test-Path "crates/game-client/updater.pub")) {
            throw "Missing crates/game-client/updater.pub. Run npm run client:updater:setup locally and commit only the public key."
          }

      - name: Prepare updater signing key
        shell: pwsh
        env:
          ALDORIA_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ALDORIA_UPDATER_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY."
          }
          $privateKey = $env:ALDORIA_UPDATER_PRIVATE_KEY.Trim()
          try {
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($privateKey))
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY is not valid base64 key content."
          }
          if (-not $decoded.StartsWith("untrusted comment: rsign encrypted secret key")) {
            throw "TAURI_SIGNING_PRIVATE_KEY does not decode to the expected signing-key format."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "aldoria-updater.key"
          [IO.File]::WriteAllText($keyPath, $privateKey, [Text.UTF8Encoding]::new($false))
          "ALDORIA_UPDATER_KEY_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Fast signing preflight
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "aldoria-signing-probe.txt"
          [IO.File]::WriteAllText($probe, "aldoria-native-signing-preflight", [Text.UTF8Encoding]::new($false))
          npm exec -- tauri signer sign --private-key-path "$env:ALDORIA_UPDATER_KEY_PATH" "--password=" "$probe"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$probe.sig")) {
            throw "Native updater signing preflight failed."
          }
          Remove-Item $probe, "$probe.sig" -Force

      - name: Build, package and sign native client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("client-v")) { throw "Expected client-v* tag, got '$tag'." }
          $version = $tag.Substring("client-v".Length)
          $env:ALDORIA_NATIVE_RELEASE_VERSION = $version
          $env:ALDORIA_DEFAULT_API_URL = "http://213.65.167.85:4000/api"
          $env:ALDORIA_DEFAULT_WS_URL = "ws://213.65.167.85:4000/ws"
          cargo build -p game-client --bin game-client --release
          if ($LASTEXITCODE -ne 0) { throw "Native Bevy client release build failed." }

          $sourceExe = Join-Path $env:GITHUB_WORKSPACE "target/release/game-client.exe"
          $assetSource = Join-Path $env:GITHUB_WORKSPACE "assets"
          if (-not (Test-Path $sourceExe)) { throw "Native executable was not produced." }
          if (-not (Test-Path $assetSource)) { throw "Shared asset directory is missing." }

          $stage = Join-Path $env:RUNNER_TEMP "Embers-of-Aldoria"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $publishedExe = Join-Path $stage "EmbersOfAldoria.exe"
          Copy-Item $sourceExe $publishedExe -Force
          Copy-Item $assetSource (Join-Path $stage "assets") -Recurse -Force

          $zipPath = Join-Path $env:RUNNER_TEMP "Embers-of-Aldoria-Native-windows-x86_64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -CompressionLevel Optimal
          npm exec -- tauri signer sign --private-key-path "$env:ALDORIA_UPDATER_KEY_PATH" "--password=" "$zipPath"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$zipPath.sig")) {
            throw "Native bundle signing failed."
          }
          $signature = (Get-Content -Raw "$zipPath.sig").Trim()
          $manifestPath = Join-Path $env:RUNNER_TEMP "native-latest.json"
          $downloadUrl = "https://github.com/Ghilea/tibiaCloneGame/releases/download/$tag/Embers-of-Aldoria-Native-windows-x86_64.zip"
          $manifest = [ordered]@{
            version = $version
            platform = "windows-x86_64"
            url = $downloadUrl
            signature = $signature
            executable = "EmbersOfAldoria.exe"
            tag = $tag
          }
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          "ALDORIA_NATIVE_EXE=$publishedExe" >> $env:GITHUB_ENV
          "ALDORIA_NATIVE_ZIP=$zipPath" >> $env:GITHUB_ENV
          "ALDORIA_NATIVE_SIG=$zipPath.sig" >> $env:GITHUB_ENV
          "ALDORIA_NATIVE_MANIFEST=$manifestPath" >> $env:GITHUB_ENV

      - name: Publish native release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:ALDORIA_NATIVE_EXE" `
            "$env:ALDORIA_NATIVE_ZIP" `
            "$env:ALDORIA_NATIVE_SIG" `
            "$env:ALDORIA_NATIVE_MANIFEST" `
            --title "Embers of Aldoria ${{ github.ref_name }}" `
            --notes "Native Rust/Bevy friend-test client. Extract the zip and keep the assets directory beside EmbersOfAldoria.exe."
